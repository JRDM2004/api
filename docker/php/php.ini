;Configuración recomendada para Laravel 13 en contenedores
memory_limit=256M
upload_max_filesize=20M
post_max_size=20M
max_execution_time=60
max_input_time=60
date.timezone=America/Mazatlan

; Seguridad: no exponer información del stack
expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2

; Sesiones
session.cookie_httponly=1
session.cookie_secure=1
session.use_strict_mode=1
